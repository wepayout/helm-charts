# Default values for deployment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is here so you don't have to worry about it.
imagePullSecrets:
  - name: "docker-registry"

strategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxUnavailable: 0%
  #   maxSurge: 50%

# Seconds a new pod must stay Ready before it counts as available and the
# rollout proceeds to remove the next old pod. Unset (default) keeps the
# Kubernetes default of 0 and renders nothing.
minReadySeconds: ~
  # minReadySeconds: 10

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podLabels: {}

deploymentLabels: {}

istio:
  app: ""
  version: "current"

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  enabled: true
  type: ClusterIP
  # Kubernetes trafficDistribution (GA 1.35): "" keeps the default (any endpoint),
  # PreferSameZone routes to endpoints in the caller's zone when available, PreferSameNode to the
  # caller's node. Honoured by kube-proxy and by Istio sidecars (endpoint priorities).
  trafficDistribution: ""
  primaryPort:
    number: 80
    targetPort: http
    protocol: TCP
    name: http
  additionalPorts: []
  overrideLabels:
    enabled: false
    labels: {}

virtualServices:
  enabled: false
  services:
    []
    # - name: ""
    #   nameSuffix: ""
    #   hosts:
    #     - chart-example.local
    #   gateways:
    #     - gateway-example.local
    #   http:
    #     - match:
    #         - uri:
    #             prefix: "/"
    #       route:
    #         - destination:
    #             port:
    #               number: 80
    #             host: chart-example.local

destinationRules:
  enabled: false
  rules:
    []
    # - name: ""
    #   nameSuffix: ""
    #   host: ""
    #   trafficPolicy: {}
    #   subsets: []
    #   exportsTo: []

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

defaultContainerName:

autoscaling:
  enabled: false
  annotations: {}
  minReplicas: 1
  maxReplicas: 10
  pollingInterval: 30
  cooldownPeriod: 60
  fallback: {}
    # failureThreshold: 3
    # replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  metrics:
    []
    # - type: Resource
    #   resource:
    #     name: memory
    #     targetAverageUtilization: 70

# Vertical Pod Autoscaler object for this Deployment (requires the VPA controllers in the cluster).
# updateMode: Off (recommendation only), Initial, Recreate, InPlaceOrRecreate (Kubernetes >= 1.35,
# VPA >= 1.7: resizes running pods without restart, recreates only when in-place is not possible).
# The istio-proxy container is always excluded; limits are never touched (RequestsOnly).
vpa:
  enabled: false
  updateMode: "Off"
  # updater default is 2: single-replica workloads need 1 to be updated at all
  minReplicas: 1
  controlledValues: RequestsOnly
  # [] = cpu and memory; use ["memory"] for workloads with a CPU-based HPA
  controlledResources: []
  minAllowed: {}
  #  cpu: 25m
  #  memory: 96Mi
  maxAllowed: {}
  annotations: {}

triggerAuthentication:
  enabled: false
  spec:
    podIdentity:
      provider: aws-eks

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: my-app

extraEnv: []

extraEnvFrom: []

overrideCommand: []

extraArgs: []

initContainers: []
additionalContainers: []

rbac:
  create: false
  # If true, create and use RBAC resources
  # role:
  #   name: my-custom-role
  #   rules:
  #   - apiGroups: ["batch"]
  #     resources: ["cronjobs"]
  #     verbs: ["patch", "update"]
  #   - apiGroups: [""]
  #     resources: ["pods"]
  #     verbs: ["get", "list"]

  # roleBinding:
  #   name: ""
  #   roleRef: ""

livenessProbe: {}
  # httpGet:
  #   path: /health-check/
  #   port: http
  # initialDelaySeconds: 5
  # timeoutSeconds: 5
  # periodSeconds: 15

readinessProbe: {}
  # httpGet:
  #   path: /health-check/
  #   port: http
  # initialDelaySeconds: 5
  # timeoutSeconds: 5
  # periodSeconds: 15

startupProbe: ~

containerLifecycle: ~

containerPorts:
  - name: http
    containerPort: 80
    protocol: TCP

volumes: []

volumeMounts: []

extraObjects: []

serviceMonitor:
  enabled: false
  labels:
    release: prometheus-operator
  endpoints: []

prometheusRules:
  enabled: false
  groups: []

terminationGracePeriodSeconds: 30

podDisruptionBudget:
  enabled: false
  # minAvailable: 80%
  # maxUnavailable: 20%

## Configuração do SLO
slo:
  enabled: false      # Habilita/desabilita a criação do SLO
  
  ## Metadados básicos
  name: ""
  namespace: ""  # Opcional - usa .Release.Namespace se não definido
  description: ""
  summary: ""
  sloType: ""  # Tipo do SLO (availability/latency/bool)
  
  ## Configurações do SLO
  target: ""     # Target em % (99.9 = 99.9%)
  window: ""       # Janela de avaliação (1d, 1w, 4w)
  alertingDisabled: false  # Se true, desabilita alertas
  
  ## Métricas (usar --set-string para preservar formatação)
  errorsMetric: |
    sum(rate(istio_requests_total{
      <app_name>="",
      response_code=~"5.."
    }[1m]))
  
  totalMetric: |
    sum(rate(istio_requests_total{
      <app_name>=""
    }[1m]))
  
  ## Agrupamento (opcional)
  grouping: 
    - ""
  
  ## Links e documentação
  runbookUrl: ""
  
  ## Labels e annotations adicionais
  labels:
    team: ""
    severity: ""
    app.kubernetes.io/component: "slo"
  
  annotations:
    monitoring.wepayout.com/severity: ""
    implemented-by: ""

dnsConfig:
  ndots: 2